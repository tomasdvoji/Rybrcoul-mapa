<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rýbrcoul – Otevřené hospody 2026 – mapa</title>
<meta name="description" content="Interaktivní mapa akce Trutnov otevřené hospody, 19. 9. 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paper wrap">

  <header id="topbar">
    <div class="brand-row">
      <div class="brand">
        <h1>Rýbrcoul</h1>
        <p class="brand-sub">Duch hor</p>
      </div>
      <div class="topbar-right">
        <div id="clock">--:--</div>
        <div id="now-count"></div>
      </div>
    </div>
    <p class="event-line">Otevřené hospody 2026 · sobota 19. září · Trutnov</p>
    <input id="list-search" type="search" placeholder="Hledat podnik, kapelu…">
  </header>

  <main>
    <div id="map-col">
    <div id="map-frame">
      <div id="map-scroll">
        <div id="map-wrap">
          <img id="map-img" src="assets/mapa.jpg" alt="Mapa festivalu">
          <!-- hotspoty a značka polohy se vkládají z app.js -->
        </div>
      </div>
      <div class="map-buttons">
        <button id="btn-locate" title="Moje poloha" aria-label="Moje poloha">◎</button>
      </div>
    </div>

    <p class="hint">Klepni na číslo na mapě nebo v seznamu a objeví se program.</p>
    </div>

    <div id="list-col">
    <div class="list-heading">
      <span></span>
      <h2 id="list-title">Všechna místa</h2>
      <span></span>
    </div>
    <div class="list-tools">
      <button id="list-nearest">Nejblíž ke mně</button>
    </div>
    <div id="list-items"></div>
    </div>
  </main>

  <div id="toast" hidden></div>

  <!-- Detail podniku (bottom sheet) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheet-close" aria-label="Zavřít">✕</button>
    <div id="sheet-content"></div>
  </div>

</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
